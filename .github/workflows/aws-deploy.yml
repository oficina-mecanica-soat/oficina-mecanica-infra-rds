name: "☁️ AWS Deploy"
run-name: "☁️ Executar deploy AWS do RDS em ${{ inputs.environment_name }}"

on:
  workflow_call:
    inputs:
      environment_name:
        description: "GitHub Environment usado pelo deploy."
        required: true
        type: string
    outputs:
      terraform_action:
        description: "Ação resolvida: apply ou destroy."
        value: ${{ jobs.resolve_action.outputs.terraform_action }}

env:
  TF_WORKING_DIRECTORY: infra/terraform/environments/dev
  TERRAFORM_VERSION: "1.15.8"
  SSM_VPC_PREFIX: /oficina-mecanica/development/vpc
  SSM_VPC_STATUS_PARAMETER: /oficina-mecanica/development/status/vpc
  SSM_KUBERNETES_PREFIX: /oficina-mecanica/development/kubernetes
  SSM_KUBERNETES_STATUS_PARAMETER: /oficina-mecanica/development/status/kubernetes
  SSM_RDS_PREFIX: /oficina-mecanica/development/rds
  SSM_RDS_STATUS_PARAMETER: /oficina-mecanica/development/status/rds

jobs:
  resolve_action:
    name: "🔎 01 · Resolver ação do Terraform"
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment_name }}
    outputs:
      terraform_action: ${{ steps.resolve.outputs.terraform_action }}
    steps:
      - name: "📥 01 · Baixar código do repositório"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: "🚦 02 · Ler terraform-action.env e validar troca segura de destroy"
        id: resolve
        env:
          GITHUB_BEFORE: ${{ github.event.before }}
          GITHUB_AFTER: ${{ github.sha }}
          DEPLOY_ENABLED: ${{ vars.AWS_DEPLOY_ENABLED }}
        run: |
          if [ "$DEPLOY_ENABLED" != "true" ]; then
            echo "::error::AWS_DEPLOY_ENABLED não está habilitado; operação bloqueada."
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/develop" ]; then
            echo "::error::Operação AWS permitida somente pela branch develop."
            exit 1
          fi
          control_file="$TF_WORKING_DIRECTORY/terraform-action.env"
          terraform_action="$(grep -E '^[[:space:]]*TERRAFORM_ACTION[[:space:]]*=' "$control_file" | tail -n 1 | cut -d '=' -f 2- | tr -d '\r' | xargs)"
          case "$terraform_action" in
            apply|destroy) ;;
            *) echo "::error::TERRAFORM_ACTION inválido. Use apply ou destroy."; exit 1 ;;
          esac
          if [ "$terraform_action" = "destroy" ]; then
            if [ -z "$GITHUB_BEFORE" ] || [ "$GITHUB_BEFORE" = "0000000000000000000000000000000000000000" ] || ! git diff --name-only "$GITHUB_BEFORE" "$GITHUB_AFTER" -- "$control_file" | grep -qx "$control_file"; then
              echo "::error::Destroy exige alteração dedicada em terraform-action.env neste push."
              exit 1
            fi
            echo "::warning::O RDS será destruído nesta execução."
          fi
          echo "terraform_action=$terraform_action" >> "$GITHUB_OUTPUT"

  plan:
    name: "📋 02 · Preparar variáveis e gerar plano do Terraform"
    needs: resolve_action
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment_name }}
    outputs:
      db_identifier_before_destroy: ${{ steps.destroy_context.outputs.db_identifier }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_db_username: ${{ vars.DB_USERNAME }}
      TERRAFORM_ACTION: ${{ needs.resolve_action.outputs.terraform_action }}
    steps:
      - name: "📥 01 · Baixar código do repositório"
        uses: actions/checkout@v7
      - name: "🔑 02 · Configurar credenciais AWS"
        uses: aws-actions/configure-aws-credentials@v6
        id: aws_credentials
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: "🛠️ 03 · Instalar Terraform"
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: "🚦 04 · Validar dependências da VPC e Kubernetes"
        if: env.TERRAFORM_ACTION == 'apply'
        run: |
          test "$TF_VAR_db_username" != "" || { echo "::error::Configure a variável não secreta DB_USERNAME no Environment."; exit 1; }
          test "$(aws ssm get-parameter --name "$SSM_VPC_STATUS_PARAMETER" --query 'Parameter.Value' --output text)" = "ready" || { echo "::error::A VPC não está pronta."; exit 1; }
          test -n "$(aws ssm get-parameter --name "$SSM_VPC_PREFIX/vpc_id" --query 'Parameter.Value' --output text)"
          test -n "$(aws ssm get-parameter --name "$SSM_VPC_PREFIX/private_subnet_ids" --query 'Parameter.Value' --output text)"
          test "$(aws ssm get-parameter --name "$SSM_KUBERNETES_STATUS_PARAMETER" --query 'Parameter.Value' --output text)" = "ready" || { echo "::error::O Kubernetes não está pronto."; exit 1; }
          test -n "$(aws ssm get-parameter --name "$SSM_KUBERNETES_PREFIX/cluster_security_group_id" --query 'Parameter.Value' --output text)"
      - name: "📦 05 · Restaurar cache do state Terraform"
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.TF_WORKING_DIRECTORY }}/terraform.tfstate
            ${{ env.TF_WORKING_DIRECTORY }}/terraform.tfstate.backup
          key: tfstate-rds-${{ steps.aws_credentials.outputs.aws-account-id }}-${{ inputs.environment_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: tfstate-rds-${{ steps.aws_credentials.outputs.aws-account-id }}-${{ inputs.environment_name }}-
      - name: "🛡️ Validar state da conta AWS atual"
        run: node .github/scripts/bootstrap-account-state.cjs

      - name: "🛡️ Preparar configuração exclusiva de destroy"
        if: env.TERRAFORM_ACTION == 'destroy'
        run: node .github/scripts/prepare-destroy.cjs

      - name: "🚀 06 · Inicializar Terraform"
        run: terraform -chdir="$TF_WORKING_DIRECTORY" init -input=false
      - name: "🔍 07 · Validar configuração Terraform"
        run: terraform -chdir="$TF_WORKING_DIRECTORY" validate
      - name: "🛡️ 08 · Capturar RDS atual antes do destroy"
        id: destroy_context
        if: env.TERRAFORM_ACTION == 'destroy'
        run: |
          set -euo pipefail
          identifier="$(terraform -chdir="$TF_WORKING_DIRECTORY" output -json | jq -r '.rds_identifier.value // empty')"
          if [ -z "$identifier" ]; then
            identifier="${TF_VAR_db_name:-oficina-mecanica-db-dev}"
          fi
          test -n "$identifier" || { echo "::error::Identificador do RDS não encontrado."; exit 1; }
          echo "db_identifier=$identifier" >> "$GITHUB_OUTPUT"
      - &kubectl_consumidores
        name: "☸️ Preparar consulta dos consumidores"
        if: env.TERRAFORM_ACTION == 'destroy'
        uses: azure/setup-kubectl@v5
      - &validar_consumidores
        name: "🛡️ Bloquear destroy com consumidores API/Lambda"
        if: env.TERRAFORM_ACTION == 'destroy'
        env:
          EXPECTED_ACCOUNT: ${{ steps.aws_credentials.outputs.aws-account-id }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: |
          cat > "$RUNNER_TEMP/verificar-consumidores-rds.cjs" <<'CONSUMIDORES_RDS'
          const cp = require('node:child_process');
          const path = require('node:path');
          function verificar(aws, recursos, conta) {
            if (!/^\d{12}$/.test(conta || '') || aws('sts','get-caller-identity').Account !== conta)
              throw Error('Conta AWS divergente; destroy bloqueado.');
            const funcoes = aws('lambda','list-functions','--query','Functions[].FunctionName');
            if (!Array.isArray(funcoes) || funcoes.some(n=>typeof n!=='string' || !n))
              throw Error('Consulta Lambda inválida; destroy bloqueado.');
            if (funcoes.some(n=>n.startsWith('oficina-mecanica')))
              throw Error('Lambda do projeto ainda presente; destroy bloqueado.');
            const clusters = aws('eks','list-clusters','--query','clusters');
            if (!Array.isArray(clusters) || clusters.some(n=>typeof n!=='string' || !/^[A-Za-z0-9][A-Za-z0-9_-]{0,99}$/.test(n)))
              throw Error('Consulta EKS inválida; destroy bloqueado.');
            for (const cluster of clusters) {
              const lista = recursos(cluster);
              if (!lista || !Array.isArray(lista.items)) throw Error('Consulta Kubernetes inválida; destroy bloqueado.');
              // Bloqueia inclusive Deployment escalado a zero: seu retorno poderia reativar acesso ao banco.
              if (lista.items.length) throw Error('Consumidor API ainda presente; destroy bloqueado.');
            }
          }
          function main() {
            const regiao = process.env.AWS_REGION;
            if (!/^[a-z]{2}-[a-z]+-\d$/.test(regiao || '') || !process.env.RUNNER_TEMP) throw Error('Escopo operacional inválido.');
            const aws = (...args) => {
              try {
                const out = cp.execFileSync('aws',[...args,'--region',regiao,'--output','json','--no-cli-pager','--cli-connect-timeout','5','--cli-read-timeout','15'],
                  {encoding:'utf8',stdio:['ignore','pipe','pipe'],timeout:30000});
                return JSON.parse(out);
              } catch { throw Error('Consulta AWS não confirmada; destroy bloqueado.'); }
            };
            const recursos = cluster => {
              const config = path.join(process.env.RUNNER_TEMP,`rds-consumidores-${cluster}`);
              try {
                cp.execFileSync('aws',['eks','update-kubeconfig','--name',cluster,'--region',regiao,'--kubeconfig',config],
                  {stdio:['ignore','pipe','pipe'],timeout:30000});
                return JSON.parse(cp.execFileSync('kubectl',['--request-timeout=15s','--kubeconfig',config,'get','deployments,pods','--all-namespaces',
                  '--selector','app=oficina-mecanica-api','-o','json'],{encoding:'utf8',stdio:['ignore','pipe','pipe'],timeout:30000}));
              } catch { throw Error('Ausência da API não comprovada no cluster; destroy bloqueado.'); }
            };
            verificar(aws,recursos,process.env.EXPECTED_ACCOUNT);
            console.log('Ausência de consumidores API/Lambda confirmada por consultas reais.');
          }
          module.exports={verificar};
          if(require.main===module) {try{main();}catch(error){console.error(error.message);process.exitCode=1;}}
          CONSUMIDORES_RDS
          node "$RUNNER_TEMP/verificar-consumidores-rds.cjs"
      - name: "📐 09 · Gerar plano salvo do Terraform"
        run: |
          if [ "$TERRAFORM_ACTION" = "destroy" ]; then
            terraform -chdir="$TF_WORKING_DIRECTORY" plan -destroy -input=false -out=tfplan
          else
            terraform -chdir="$TF_WORKING_DIRECTORY" plan -input=false -out=tfplan
          fi
      - name: "🛡️ Validar plano exclusivo de destroy"
        if: env.TERRAFORM_ACTION == 'destroy'
        run: node .github/scripts/prepare-destroy.cjs verify-plan
      - name: "⬆️ 10 · Publicar plano salvo do Terraform"
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-rds-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TF_WORKING_DIRECTORY }}/tfplan
          retention-days: 1
          if-no-files-found: error

  apply_or_destroy:
    name: "☁️ 03 · Aplicar ou destruir RDS"
    needs: [resolve_action, plan]
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment_name }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_db_username: ${{ vars.DB_USERNAME }}
      TERRAFORM_ACTION: ${{ needs.resolve_action.outputs.terraform_action }}
      DB_IDENTIFIER_BEFORE_DESTROY: ${{ needs.plan.outputs.db_identifier_before_destroy }}
    steps:
      - name: "📥 01 · Baixar código do repositório"
        uses: actions/checkout@v7
      - name: "🔑 02 · Configurar credenciais AWS"
        uses: aws-actions/configure-aws-credentials@v6
        id: aws_credentials
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: "🛠️ 03 · Instalar Terraform"
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: "📦 04 · Restaurar cache do state Terraform"
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.TF_WORKING_DIRECTORY }}/terraform.tfstate
            ${{ env.TF_WORKING_DIRECTORY }}/terraform.tfstate.backup
          key: tfstate-rds-${{ steps.aws_credentials.outputs.aws-account-id }}-${{ inputs.environment_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: tfstate-rds-${{ steps.aws_credentials.outputs.aws-account-id }}-${{ inputs.environment_name }}-
      - name: "🛡️ Validar state da conta AWS atual"
        run: node .github/scripts/bootstrap-account-state.cjs

      - name: "🛡️ Preparar configuração exclusiva de destroy"
        if: env.TERRAFORM_ACTION == 'destroy'
        run: node .github/scripts/prepare-destroy.cjs

      - name: "🚀 05 · Inicializar Terraform"
        run: terraform -chdir="$TF_WORKING_DIRECTORY" init -input=false
      - name: "⬇️ 06 · Baixar plano salvo desta tentativa"
        uses: actions/download-artifact@v8
        with:
          name: tfplan-rds-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TF_WORKING_DIRECTORY }}
      - name: "🛡️ Validar plano exclusivo de destroy"
        if: env.TERRAFORM_ACTION == 'destroy'
        run: node .github/scripts/prepare-destroy.cjs verify-plan

      - *kubectl_consumidores
      - *validar_consumidores
      - name: "✅ 07 · Aplicar plano do Terraform"
        run: terraform -chdir="$TF_WORKING_DIRECTORY" apply -input=false -auto-approve tfplan
      - name: "🔎 Confirmar state sem recursos gerenciados"
        if: env.TERRAFORM_ACTION == 'destroy'
        run: node .github/scripts/prepare-destroy.cjs verify-state

      - name: "💾 08 · Salvar cache final do state Terraform"
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.TF_WORKING_DIRECTORY }}/terraform.tfstate
            ${{ env.TF_WORKING_DIRECTORY }}/terraform.tfstate.backup
          key: tfstate-rds-${{ steps.aws_credentials.outputs.aws-account-id }}-${{ inputs.environment_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: "🔎 09 · Validar RDS real após apply"
        if: env.TERRAFORM_ACTION == 'apply'
        run: |
          identifier="$(terraform -chdir="$TF_WORKING_DIRECTORY" output -raw rds_identifier)"
          endpoint="$(terraform -chdir="$TF_WORKING_DIRECTORY" output -raw rds_endpoint)"
          master_secret_arn="$(terraform -chdir="$TF_WORKING_DIRECTORY" output -raw rds_master_secret_arn)"
          rds_security_group_id="$(terraform -chdir="$TF_WORKING_DIRECTORY" output -raw rds_security_group_id)"
          eks_cluster_security_group_id="$(aws ssm get-parameter --name "$SSM_KUBERNETES_PREFIX/cluster_security_group_id" --query 'Parameter.Value' --output text)"
          test "$(aws rds describe-db-instances --db-instance-identifier "$identifier" --query 'DBInstances[0].DBInstanceStatus' --output text)" = "available"
          test "$(aws rds describe-db-instances --db-instance-identifier "$identifier" --query 'DBInstances[0].Endpoint.Address' --output text)" = "$endpoint"
          eks_ingress_rule_count="$(aws ec2 describe-security-group-rules --filters "Name=group-id,Values=$rds_security_group_id" --query "length(SecurityGroupRules[?IsEgress==\`false\` && IpProtocol==\`tcp\` && FromPort==\`1433\` && ToPort==\`1433\` && ReferencedGroupInfo.GroupId==\`$eks_cluster_security_group_id\`])" --output text)"
          test "$eks_ingress_rule_count" -ge 1
          test "$(aws ssm get-parameter --name "$SSM_RDS_PREFIX/endpoint" --query 'Parameter.Value' --output text)" = "$endpoint"
          test "$(aws ssm get-parameter --name "$SSM_RDS_PREFIX/master_secret_arn" --query 'Parameter.Value' --output text)" = "$master_secret_arn"
          test "$(aws ssm get-parameter --name "$SSM_RDS_STATUS_PARAMETER" --query 'Parameter.Value' --output text)" = "ready"
      - name: "🔎 09 · Validar remoção real após destroy"
        if: env.TERRAFORM_ACTION == 'destroy'
        run: |
          set -euo pipefail
          test -n "$DB_IDENTIFIER_BEFORE_DESTROY" || { echo "::error::Não há identificador para confirmar a remoção do RDS."; exit 1; }
          if output="$(aws rds describe-db-instances --db-instance-identifier "$DB_IDENTIFIER_BEFORE_DESTROY" 2>&1)"; then
            echo "::error::A instância RDS ainda existe."
            exit 1
          elif [[ "$output" != *"(DBInstanceNotFound)"* ]]; then
            echo "$output" >&2
            exit 1
          fi
          for parameter_name in "$SSM_RDS_PREFIX/endpoint" "$SSM_RDS_PREFIX/security_group_id" "$SSM_RDS_PREFIX/master_secret_arn" "$SSM_RDS_STATUS_PARAMETER"; do
            if output="$(aws ssm get-parameter --name "$parameter_name" 2>&1)"; then
              aws ssm delete-parameter --name "$parameter_name"
              if output="$(aws ssm get-parameter --name "$parameter_name" 2>&1)"; then
                echo "::error::O parâmetro $parameter_name ainda existe após a limpeza."
                exit 1
              elif [[ "$output" != *"(ParameterNotFound)"* ]]; then
                echo "$output" >&2
                exit 1
              fi
            elif [[ "$output" != *"(ParameterNotFound)"* ]]; then
              echo "$output" >&2
              exit 1
            fi
          done
